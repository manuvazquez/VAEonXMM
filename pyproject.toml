[project]
name = "trapallada"
version = "0.3.0"
description = "Time-series Recognition and Analysis Platform for Astronomical Lightcurve Labeling and Data Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair",
    "astropy",
    "astroquery==0.4.6", # seemingly, astroquery 0.4.7's XMMNewton.download_data does not support full paths in "filename" argument
    "equinox",
    "ipywidgets",
    # "jax[cuda12]", # <------------------ CUDA
    "jax", # <------------------ CPU-only
    "matplotlib",
    "mlflow",
    "numpyro",
    "openpyxl",
    "optax",
    "pandas",
    "plotly",
    "pyarrow",
    "ruamel-yaml>=0.18.14",
    "scikit-learn",
    "scipy",
    "statsmodels>=0.14.4",
    "torch",
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["trapallada"]

[tool.uv]
package = true
# in order to deal with this bug https://github.com/astral-sh/uv/issues/16685
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
"trap_fit_vae_on_signals.py" = "trapallada.core:cl_fit_vae_on_signals"
"trap_grid_fit_vae_on_signals.py" = "trapallada.core:cl_grid_fit_vae_on_signals"
"trap_download_obs.py" = "trapallada.xsa.util:cl_download_observations"
"trap_pack_obs.py" = "trapallada.xsa.util:cl_tars_to_array"

# <------------------ CPU-only
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

# ===========================

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "bokeh",
    "hdbscan",
    "ipdb",
    "ipykernel",
    "ipython",
    "nbconvert",
    "nbformat",
    "papermill",
    "marimo",
    "openai>=1.84.0",
    "nbdime>=4.0.2",
    "kaleido>=1.1.0",
]

