PRNG seeds:
  model initialization:
    decoder: 43
    encoder: 42
  sampling:
    training set: 14
    validation set: 15
  training dataloader: 43
  training-validation splitting: 42
loss:
  x_sd: 0.15 # <---- FFT
model: &model
  channels:
  - 12
  - 12
  - 12
  dim_z: 50
  kernel_sizes: # <---- FFT (due to redundancy)
  - 64
  - 32
  - 16
  stride: 2
data:
    normalize: false
    fft: false # <---- FFT
training:
  batch_size: 32
  dl_rng_key: 43
  learning_rate: 3.0e-05
  n_epochs: 2
  train_test_split:
    test_size: 0.2
VAE:
  class: VAE
  encoder:
    class: Encoder
    parameters:
      << : [*model]
  decoder:
    class: Decoder # <---- FFT (NonNegativeDecoder/NonNegativeConditionalDecoder)
    parameters:
      << : [*model]