PRNG seeds:
  model initialization:
    decoder: 43
    encoder: 42
  sampling:
    training set: 14
    validation set: 15
  training dataloader: 43
  training-validation splitting: 42
loss:
  x_sd: 0.15 # <---- FFT
  beta: 1.
model: &model
  # channels: [12, 12, 12]
  channels:
  - 8
  - 16
  - 32
  dim_z: 40
  kernel_sizes: # <---- FFT (due to redundancy)
  - 64
  - 32
  - 16
  # stride: 2
  stride:
  - 2
  - 2
  - 2
data:
    fft: false # <---- FFT
training:
  batch_size: 32
  dl_rng_key: 43
  learning_rate: 3.0e-05
  n_epochs: 2
  
  # ratio of the dataset to use for validation
  train_test_split:
    test_size: 0.2
  
  # whether or not to ignore non "good time intervals" (GTIs) in the loss function; it only
  # makes sense when working with time-domain signals, and will be ignored for frequency-domain ones
  mask_non_gti_intervals: true
VAE:
  class: VAE
  encoder:
    class: Encoder
    parameters:
      << : [*model]
  decoder:
    class: Decoder # <---- FFT (NonNegativeDecoder/NonNegativeConditionalDecoder)
    parameters:
      << : [*model]

grid search:
  model.dim_z: [2, 5, 10, 20, 50]
  loss.beta: [0.01, 0.1, 0.5, 1, 5, 10]