PRNG seeds:
  model initialization:
    decoder: 43
    encoder: 42
  sampling:
    training set: 14
    validation set: 15
  training dataloader: 43
  training-validation splitting: 42
loss:
  x_sd: 0.5 # <---- FFT
model: &model
  input_size:
  - 1
  - 10000 # <---- FFT (due to redundancy)
  channels:
  - 12
  - 12
  - 12
  dim_z: 10
  kernel_sizes: # <---- FFT (due to redundancy)
  - 128
  - 64
  - 32
  stride: 2
data:
    normalize: false
    fft: false # <---- FFT
training:
  batch_size: 32
  dl_rng_key: 43
  learning_rate: 3.0e-05
  n_epochs: 3
  train_test_split:
    test_size: 0.2
VAE:
  encoder:
    class: Encoder
    parameters:
      << : [*model]
  decoder:
    class: Decoder # <---- FFT (NonNegativeDecoder)
    parameters:
      << : [*model]